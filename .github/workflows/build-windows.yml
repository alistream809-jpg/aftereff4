name: Build AFTER TRUE for Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create vcpkg cache folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore FFmpeg build cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-ffmpeg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Configure (CMake + vcpkg installs FFmpeg)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run automated tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package (EXE folder, portable ZIP, installer)
        shell: pwsh
        run: ./tools/package-windows.ps1 -BuildDir build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AFTER-TRUE-Installer
          path: dist/AFTER-TRUE-Installer-*.exe
          if-no-files-found: error

      - name: Upload portable version
        uses: actions/upload-artifact@v4
        with:
          name: AFTER-TRUE-Portable
          path: dist/AFTER-TRUE-Portable-*.zip
          if-no-files-found: error

      - name: Attach files to the GitHub Release (only for version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AFTER-TRUE-Installer-*.exe
            dist/AFTER-TRUE-Portable-*.zip
          generate_release_notes: true
